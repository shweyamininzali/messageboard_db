<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f4ef" />
    <title>Neighborhood Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="board-shell">
      <header class="board-header">
        <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> THE NEIGHBORHOOD</p>
        <h1>Good to see you.</h1>
        <p class="intro">A little room for the whole neighborhood.</p>
      </header>

      <section class="chat-room" aria-labelledby="room-title">
        <header class="room-header">
          <div>
            <p class="room-kicker">COMMUNITY ROOM</p>
            <h2 id="room-title">Neighborhood chat</h2>
          </div>
          <div class="room-presence">
            <span class="presence-dot" aria-hidden="true"></span>
            <span id="realtime-status" role="status" aria-live="polite">Connecting...</span>
          </div>
        </header>
        <div id="post-list" class="post-list" aria-live="polite" aria-busy="true">
          <p class="feed-state">Joining the conversation...</p>
        </div>
        <form id="post-form" class="message-form">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" maxlength="80" autocomplete="name" placeholder="How should we call you?" required />
          <div class="composer">
            <label class="visually-hidden" for="message">Your message</label>
            <textarea id="message" name="message" maxlength="2000" rows="2" placeholder="Write a message..." required></textarea>
            <button id="submit-button" type="submit" aria-label="Send message">
              <span>Send</span>
              <span class="button-arrow" aria-hidden="true">&#8593;</span>
            </button>
          </div>
          <div class="form-footer">
            <span id="form-status" class="form-status" role="status" aria-live="polite"></span>
            <span class="composer-hint">Enter to send · Shift + Enter for a new line</span>
          </div>
        </form>
      </section>
      <footer class="board-footer"><span>MESSAGES ARE SAVED</span><span id="post-count">0 messages</span></footer>
    </main>
  </body>
</html>
